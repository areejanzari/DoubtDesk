services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: doubtdesk
      POSTGRES_PASSWORD: doubtdesk
      POSTGRES_DB: doubtdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - doubtdesk_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doubtdesk -d doubtdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://doubtdesk:doubtdesk@postgres:5432/doubtdesk}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    volumes:
      - doubtdesk_data:/app/data
      - doubtdesk_hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  doubtdesk_data:
  doubtdesk_hf_cache:
  doubtdesk_pg:
