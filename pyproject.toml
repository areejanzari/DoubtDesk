[project]
name = "doubtdesk"
version = "0.1.0"
description = "A multimodal RAG tutor with support for STEM PDFs"

authors = [
    { name = "areejanzari", email = "areejanzari512@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "onnxruntime>=1.31.0",
    "openai>=2,<3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
    "ragas>=0.4.3,<0.5",
    "langfuse>=4.7,<5",
    "langchain-groq>=1.1.3",
    "langchain-community==0.3.31",
]

[project.scripts]
doubtdesk = "doubtdesk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
