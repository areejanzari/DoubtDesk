[project]
name = "doubtdesk"
version = "0.1.0"
description = "A multimodal RAG tutor with support for STEM PDFs"

authors = [
    { name = "areejanzari", email = "areejanzari512@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.33.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
doubtdesk = "doubtdesk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
