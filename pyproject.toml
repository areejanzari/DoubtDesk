[project]
name = "doubtdesk"
version = "0.1.0"
description = "A multimodal RAG tutor with support for STEM PDFs"
readme = "README.md"
authors = [
    { name = "areejanzari", email = "areejanzari512@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[project.scripts]
doubtdesk = "doubtdesk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
