name: DoubtDesk CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: doubtdesk
          POSTGRES_PASSWORD: doubtdesk
          POSTGRES_DB: doubtdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doubtdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://doubtdesk:doubtdesk@127.0.0.1:5432/doubtdesk_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov=doubtdesk --cov-branch --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: doubtdesk
          POSTGRES_PASSWORD: doubtdesk
          POSTGRES_DB: doubtdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doubtdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://doubtdesk:doubtdesk@127.0.0.1:5432/doubtdesk_e2e

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12
        working-directory: .

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
        working-directory: .

      - name: Install backend dependencies
        run: uv sync --frozen --dev
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
